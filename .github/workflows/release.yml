name: Release

# Builds signed-off (unsigned/debug-signed) APKs for every version tag and
# attaches them to the GitHub Release. Tag-driven only — not a PR gate.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (caches dependencies, wrapper and build cache)
        uses: gradle/actions/setup-gradle@v4

      # One invocation: single configuration pass; R8 release reuses
      # classes compiled by the earlier tasks in the same build.
      - name: Unit tests + assemble APKs
        run: ./gradlew test assembleDebug assembleRelease --console=plain --stacktrace

      - name: Rename artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p staging
          cp app/build/outputs/apk/debug/app-debug.apk \
            "staging/Spreva-${VERSION}-debug.apk"
          # Without an upload keystore (Phase 3), AGP emits an unsigned APK.
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            "staging/Spreva-${VERSION}-release-unsigned.apk"
          ls -la staging

      - name: Attach APKs to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/*.apk
          fail_on_unmatched_files: true
