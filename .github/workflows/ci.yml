name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Cancel superseded runs on the same branch/PR to keep feedback fast.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle caching: dependencies, wrapper distributions and the shared
      # build cache. main writes/refreshes the cache; PRs read it read-only,
      # so a warm PR build skips nearly all dependency downloads.
      - name: Setup Gradle (caches dependencies, wrapper and build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # One invocation for everything: a single configuration pass, and
      # `assembleDebug` reuses the compiled classes produced by `test`.
      - name: Unit tests + assemble debug
        run: ./gradlew test assembleDebug --console=plain --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
