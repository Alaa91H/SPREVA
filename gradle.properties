# JVM
# user.language/country=EN force locale-independent codegen: Room's compiler
# (and others) format numbers via String.format, which emits Arabic-Indic
# digits on Arabic-locale machines and breaks generated Kotlin sources.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Duser.language=en -Duser.country=US

# Gradle
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
